name: Eye tracking checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-demo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gallery.txt
      - run: python -m pip install -r requirements-gallery.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
      - run: python gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: eye-demo-${{ matrix.os }}
          path: |
            assets/*.png
            assets/*.gif
            assets/*.json
            examples/*.json
          if-no-files-found: error

  cpp-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
